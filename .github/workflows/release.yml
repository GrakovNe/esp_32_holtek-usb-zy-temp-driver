name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          command: >
            idf.py build &&
            esptool.py --chip esp32s3 merge_bin -o build/airmonitor.bin
            --flash_mode dio --flash_size 4MB --flash_freq 80m
            0x0 build/bootloader/bootloader.bin
            0x8000 build/partition_table/partition-table.bin
            0x10000 build/esp32_zytemp.bin

      - name: Version
        id: ver
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Assemble the flasher page
        run: |
          mkdir -p site
          cp flasher/index.html site/
          cp build/airmonitor.bin site/
          cp build/esp32_zytemp.bin site/
          sed "s/__VERSION__/${{ steps.ver.outputs.tag }}/" flasher/manifest.json > site/manifest.json

      - name: Attach binaries to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/airmonitor.bin
            build/esp32_zytemp.bin

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
